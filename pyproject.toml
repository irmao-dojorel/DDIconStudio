[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddiconstudio"
version = "0.1.0"
description = "Gerador de icones de vocacao do DDCore (Dragon's Dogma 2)"
requires-python = ">=3.10"
dependencies = ["pillow>=11", "numpy>=2", "flet[desktop,cli]>=1.0,<2", "xxhash>=3.5", "zstandard>=0.23"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16"]

[project.gui-scripts]
ddiconstudio = "ddiconstudio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
